[theme]
base = "light"
primaryColor = "#1F6FB2"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F2D59"
font = "sans serif"

[client]
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
